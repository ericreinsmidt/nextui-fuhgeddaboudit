<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280">
  <!-- Sky background -->
  <rect width="1280" height="1280" fill="#87CEEB"/>

  <!-- Sign posts (behind sign) -->
  <rect x="460" y="260" width="20" height="1020" fill="#555" rx="3"/>
  <rect x="800" y="260" width="20" height="1020" fill="#555" rx="3"/>

  <!-- Sign body with rounded corners -->
  <rect x="40" y="260" width="1200" height="760" rx="40" ry="40" fill="#006B3F"/>

  <!-- White border inset -->
  <rect x="55" y="275" width="1170" height="730" rx="32" ry="32" fill="none" stroke="white" stroke-width="8"/>

  <!-- Blue top section (1/3 of sign = ~253px) -->
  <rect x="59" y="279" width="1162" height="253" rx="28" ry="28" fill="#1A5DAB"/>
  <!-- Square off bottom corners of blue section -->
  <rect x="59" y="440" width="1162" height="92" fill="#1A5DAB"/>
  <!-- Green overlap to create the straight dividing line -->
  <rect x="59" y="512" width="1162" height="20" fill="#006B3F"/>

  <!-- "Leaving NextUI" centered in blue section -->
  <text x="640" y="390" text-anchor="middle" dominant-baseline="central" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="110" fill="white" letter-spacing="2">Leaving NextUI</text>

  <!-- "Fuhgeddaboudit" centered in green section -->
  <text x="640" y="730" text-anchor="middle" dominant-baseline="central" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="130" fill="white" letter-spacing="3">Fuhgeddaboudit</text>
</svg>
