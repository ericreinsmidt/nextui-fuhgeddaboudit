<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Full background fill -->
  <rect x="0" y="0" width="128" height="128" fill="#3a3a42"/>

  <!-- Gamepad body - simple rounded rectangle -->
  <rect x="28" y="44" width="72" height="40" rx="8" ry="8" fill="#888"/>

  <!-- D-pad vertical -->
  <rect x="42" y="55" width="6" height="18" rx="1.5" fill="#3a3a42"/>
  <!-- D-pad horizontal -->
  <rect x="36" y="61" width="18" height="6" rx="1.5" fill="#3a3a42"/>

  <!-- Buttons -->
  <circle cx="82" cy="57" r="3.5" fill="#3a3a42"/>
  <circle cx="74" cy="64" r="3.5" fill="#3a3a42"/>
  <circle cx="82" cy="71" r="3.5" fill="#3a3a42"/>
  <circle cx="90" cy="64" r="3.5" fill="#3a3a42"/>
</svg>
